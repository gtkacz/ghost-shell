[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
futures-core = "0.3.34"
nix = { version = "0.31.3", default-features = false }
notify = "8.2.0"
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }
