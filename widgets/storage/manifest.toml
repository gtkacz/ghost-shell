id = "storage"
name = "Storage"
version = "0.1.0"
api = 1
kinds = ["panel"]
requires = ["disks"]
# A dead drive is shown as a boxed alert, whose stripes scroll and whose text blinks for the first seconds after it appears.
animates = true

# Whether drives with nothing mounted are listed.
[settings.show_unmounted]
type = "bool"
default = true
