id = "media"
name = "Media"
version = "0.1.0"
api = 1
kinds = ["panel"]
requires = []
# The spectrum redraws at 30 frames/s while the player plays, and a new track's title scrambles in.
animates = true

[settings.style]
type = "enum"
values = ["stack", "strip", "compact"]
default = "stack"

# The audio output and input rows.
[settings.audio]
type = "bool"
default = true
