id = "clock"
name = "Clock"
version = "0.1.0"
api = 1
kinds = ["panel"]
requires = ["host"]
# The hero and the band show the weather's alert box, whose stripes scroll and whose text blinks (R35).
animates = true

[settings.style]
type = "enum"
values = ["hero", "band", "compact"]
default = "hero"

[settings.weather]
type = "bool"
default = true
