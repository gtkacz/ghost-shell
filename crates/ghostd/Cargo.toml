[package]
name = "ghostd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
futures-core.workspace = true
ghost-proto = { path = "../ghost-proto" }
nix = { workspace = true, features = ["feature", "fs", "hostname", "signal", "socket"] }
notify.workspace = true
nvml-wrapper.workspace = true
pipewire.workspace = true
realfft.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
zbus = { workspace = true, features = ["proxy", "service"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zbus = { workspace = true, features = ["p2p"] }
