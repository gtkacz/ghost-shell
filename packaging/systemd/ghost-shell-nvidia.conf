# NVIDIA only; installed by scripts/install.sh when every file named here exists.
[Service]
Environment=__EGL_EXTERNAL_PLATFORM_CONFIG_FILENAMES=/usr/share/egl/egl_external_platform.d/10_nvidia_wayland.json
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
# The driver doesn't create a missing cache directory; it silently compiles every start instead.
CacheDirectory=ghost-shell
Environment=__GL_SHADER_DISK_CACHE_PATH=%C/ghost-shell
Environment=__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
